<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      body {
        margin: 0;
        background: #fafafa url('{{ "/assets/images/body-bg.jpg" | relative_url }}') 0 0 repeat;
        color: #333;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
      }
      .page-header {
        background: #2e7bcf url('{{ "/assets/images/header-bg.jpg" | relative_url }}') 0 0 repeat-x;
        border-bottom: solid 1px #275da1;
        color: #fff;
        padding: 1.75rem 2rem;
        text-align: center;
        font-family: 'Architects Daughter', 'Helvetica Neue', Helvetica, Arial, serif;
      }
      .page-header h1.project-name {
        margin: 0 0 0.25rem;
        font-size: 2.25rem;
        font-weight: normal;
        color: #fff;
        width: auto;
        letter-spacing: -0.5px;
      }
      .page-header h2.project-tagline {
        margin: 0;
        font-size: 1.1rem;
        font-weight: normal;
        color: #9ddcff;
        width: auto;
      }
      .main-content .btn {
        display: inline-block;
        margin: 0 0.4rem 0.5rem 0;
        padding: 0.5rem 1.2rem;
        color: #1e6bb8;
        background-color: #fff;
        border: 1px solid #1e6bb8;
        border-radius: 0.3rem;
        font-size: 0.95rem;
        text-decoration: none;
        transition: background-color 0.2s, color 0.2s;
      }
      .main-content .btn:hover {
        background-color: #1e6bb8;
        color: #fff;
        text-decoration: none;
      }
      .main-content {
        max-width: 64rem;
        margin: 0 auto;
        padding: 3rem 2rem;
        float: none;
        width: auto;
      }
      .main-content h2 {
        margin-top: 2rem;
        padding-bottom: 0.3rem;
        border-bottom: 1px solid #e6e6e6;
        color: #222;
        font-weight: 600;
      }
      .main-content h2:before { content: none; }
      .main-content p { margin: 0 0 1rem; }
      .main-content ul { padding-left: 1.5rem; }
      .main-content li { margin-bottom: 0.5rem; }
      .main-content a { color: #1e6bb8; text-decoration: none; }
      .main-content a:hover { color: #144d80; text-decoration: underline; }
      .site-footer {
        max-width: 64rem;
        margin: 0 auto;
        padding: 1.5rem 2rem 3rem;
        border-top: 1px solid #e6e6e6;
        font-size: 0.85rem;
        color: #888;
      }
      .site-footer a { color: #666; }
      @media (max-width: 640px) {
        .page-header { padding: 1.25rem 1rem; }
        .page-header h1.project-name { font-size: 1.5rem; }
        .page-header h2.project-tagline { font-size: 0.9rem; }
        .main-content { padding: 2rem 1rem; }
        .site-footer { padding: 1.5rem 1rem 2rem; }
      }
    </style>
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body>
    <header class="page-header" role="banner">
      <h1 class="project-name">{{ page.title | default: site.title | default: site.github.repository_name }}</h1>
      <h2 class="project-tagline">{{ page.description | default: site.description | default: site.github.project_tagline }}</h2>
    </header>

    <main class="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>This page was generated by <a href="https://pages.github.com">GitHub Pages</a>.</span>
    </footer>
  </body>
</html>
